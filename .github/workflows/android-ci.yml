name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx4096m -Dfile.encoding=UTF-8"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    name: Validate, Test, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate recipe dataset
        run: node tools/validate-recipes.js

      - name: Validate bundled full catalog
        run: python tools/validate_full_catalog.py

      - name: Validate update product registry
        run: python tools/update_manager.py validate-config

      - name: Audit recipe provenance and educational completeness
        run: node tools/audit-recipes.js

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "✅ Android SDK 35 is available on the runner." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: true

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Validate Project
        run: ./gradlew projects --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile Instrumented UI Tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "### Release signing status" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "✅ Release signing configured from GitHub Secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Release signing secrets are not configured. Release APK/AAB will be UNSIGNED. Debug APK remains installable." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify and package outputs
        run: |
          set -euo pipefail
          mkdir -p dist
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ashpazyar-debug.apk
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" dist/ashpazyar-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab dist/ashpazyar-release.aab
          ls -lh dist
          echo "### Build artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist | tail -n +2 | awk '{print "- `"$9"` — "$5}' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Cafe Bazaar signed binary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_PATH:-}" ] || [ -z "${RELEASE_STORE_PASSWORD:-}" ] || [ -z "${RELEASE_KEY_ALIAS:-}" ] || [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are required to generate the Cafe Bazaar .bin."
            exit 1
          fi
          JAR="$RUNNER_TEMP/bundlesigner-0.1.14.jar"
          curl -fL --retry 3 -o "$JAR" "https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.14/bundlesigner-0.1.14.jar"
          echo "aef2c387f678558e3a4baddab9730fbdca64ef28a0e2e0245491e1088b4968f5  $JAR" | sha256sum -c -
          mkdir -p dist/bazaar-tmp
          java -jar "$JAR" genbin -v \
            --bundle dist/ashpazyar-release.aab \
            --bin dist/bazaar-tmp \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks "$RELEASE_KEYSTORE_PATH" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "env:RELEASE_STORE_PASSWORD" \
            --key-pass "env:RELEASE_KEY_PASSWORD"
          BAZAAR_BIN=$(find dist/bazaar-tmp -type f -name "*.bin" | head -n 1)
          test -n "$BAZAAR_BIN"
          cp "$BAZAAR_BIN" dist/ghashogh-bazaar.bin
          rm -rf dist/bazaar-tmp
          test -s dist/ghashogh-bazaar.bin
          sha256sum dist/ghashogh-bazaar.bin > dist/ghashogh-bazaar.bin.sha256
          echo "### Cafe Bazaar bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghashogh-bazaar.bin — $(stat -c%s dist/ghashogh-bazaar.bin) bytes" >> "$GITHUB_STEP_SUMMARY"
          cat dist/ghashogh-bazaar.bin.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ashpazyar-build-${{ github.run_number }}
          path: |
            dist/ashpazyar-debug.apk
            dist/ashpazyar-release.apk
            dist/ashpazyar-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Cafe Bazaar signed binary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ghashogh-bazaar-${{ github.run_number }}
          path: |
            dist/ghashogh-bazaar.bin
            dist/ghashogh-bazaar.bin.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  ui-tests:
    name: Compose UI Tests (API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: true

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented Compose tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
